<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#faf6f0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Life" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Life Tracker</title>
<style>
  :root {
    --bg: #faf6f0;
    --card: #fffdf8;
    --card-soft: #f5ede0;
    --border: #e8dccd;
    --border-strong: #d8c8b0;
    --text: #3d2817;
    --text-soft: #6b563f;
    --muted: #9a8870;
    --accent: #c89968;
    --accent-deep: #a87445;
    --accent-soft: #f0dfc4;
    --done: #87a96b;
    --done-soft: #d5e2c4;
    --partial: #d9b380;
    --partial-soft: #f0dfc4;
    --error: #a04040;
    --modal-bg: rgba(60, 40, 23, 0.4);
    --on-accent: #fffaf2;
    --warm-grad: linear-gradient(135deg, #fff5e3 0%, #f0dfc4 100%);
    --warm-grad-banner: linear-gradient(135deg, #f5e6cd 0%, #f0dfc4 100%);
    --warm-grad-fg: var(--accent-deep);
    --shadow: 0 1px 2px rgba(60, 40, 23, 0.05);
    --shadow-md: 0 2px 8px rgba(60, 40, 23, 0.08);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #1a1410;
    --card: #241c14;
    --card-soft: #2e2418;
    --border: #3a2d20;
    --border-strong: #4d3c2a;
    --text: #f4ebd9;
    --text-soft: #c8b89a;
    --muted: #8a7a62;
    --accent: #d4a574;
    --accent-deep: #e0b585;
    --accent-soft: #3a2c1d;
    --done: #a8c485;
    --done-soft: #2d3621;
    --partial: #d9b380;
    --partial-soft: #3a2c1d;
    --error: #e89a9a;
    --modal-bg: rgba(0, 0, 0, 0.65);
    --on-accent: #1a1410;
    --warm-grad: linear-gradient(135deg, #3a2c1d 0%, #2a2014 100%);
    --warm-grad-banner: linear-gradient(135deg, #3a2c1d 0%, #2e2418 100%);
    --warm-grad-fg: var(--accent);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app { max-width: 640px; margin: 0 auto; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; color: inherit; font-size: 16px; }
  textarea { resize: vertical; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h1 { font-size: 22px; }
  h2 { font-size: 18px; }
  h3 { font-size: 15px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  p { margin: 0; }
  a { color: var(--accent-deep); }

  /* Layout */
  .scroll {
    padding: 16px 16px 100px;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .header {
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .header .date {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .header .title {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .card-tight { padding: 12px; }
  .card-flat { box-shadow: none; }
  .card h2 { margin-bottom: 12px; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    background: var(--card-soft);
    color: var(--text);
    border: 1px solid var(--border);
    transition: background 0.12s ease, transform 0.12s ease;
  }
  .btn:active { transform: scale(0.98); background: var(--accent-soft); }
  .btn-primary {
    background: var(--accent-deep);
    color: var(--on-accent);
    border-color: var(--accent-deep);
  }
  .btn-primary:active { background: var(--accent); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-soft); }
  .btn-icon {
    width: 36px; height: 36px; padding: 0; border-radius: 10px;
  }
  .btn-block { display: flex; width: 100%; }

  /* Inputs */
  .input, .textarea, .textarea-line, .select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    outline: none;
    transition: border-color 0.12s ease;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
  }
  .input:focus, .textarea:focus, .textarea-line:focus, .select:focus {
    border-color: var(--accent);
  }
  .textarea, .textarea-line {
    resize: none;            /* auto-grow handles it */
    overflow: hidden;        /* no scrollbars; grow to fit */
  }
  .textarea      { min-height: 70px; }
  .textarea-line { min-height: 42px; }   /* starts at one line, grows from there */
  .label {
    display: block;
    font-size: 12px;
    color: var(--text-soft);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  /* Habit cells */
  .habit-cell {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 500;
    border: 1.5px solid var(--border-strong);
    background: var(--card);
    color: var(--muted);
    transition: all 0.12s ease;
  }
  .habit-cell:active { transform: scale(0.92); }
  .habit-cell.done {
    background: var(--done);
    border-color: var(--done);
    color: #fff;
  }
  .habit-cell.partial {
    background: var(--partial);
    border-color: var(--partial);
    color: #fff;
  }
  .habit-cell.today {
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* Habit grid (two-row layout: name on top, day cells below) */
  .grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .habit-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .habit-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
  }
  .habit-name .ico { font-size: 18px; line-height: 1; flex-shrink: 0; }
  .habit-name .nm  { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .habit-name .tot {
    color: var(--text-soft);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .habit-cells {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .habit-day-headers {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .habit-day-headers > div {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .habit-cells .habit-cell {
    width: 100%;
    height: 38px;
    border-radius: 10px;
  }

  /* Tab bar */
  .tabbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 640px;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .tab {
    flex: 1;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: color 0.12s ease;
  }
  .tab.active { color: var(--accent-deep); }
  .tab .ic { font-size: 18px; line-height: 1; }

  /* Banner / reminder */
  .banner {
    background: var(--warm-grad-banner);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .banner h3 { color: var(--warm-grad-fg); margin-bottom: 6px; }
  .banner ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--text-soft); }

  /* Moon */
  .moon-display {
    text-align: center;
    padding: 8px 0 16px;
  }
  .moon-emoji {
    font-size: 96px;
    line-height: 1;
    filter: drop-shadow(0 2px 8px rgba(60, 40, 23, 0.15));
    margin-bottom: 8px;
  }
  .moon-name {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .moon-theme {
    font-size: 14px;
    color: var(--accent-deep);
    font-style: italic;
    margin-bottom: 8px;
  }
  .moon-meta {
    font-size: 13px;
    color: var(--muted);
  }

  /* Gene Key */
  .key-num {
    font-size: 56px;
    font-weight: 300;
    color: var(--accent-deep);
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .key-tier {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 12px;
    background: var(--card-soft);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .key-tier-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 500;
  }
  .key-tier-value {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
  }

  /* Pills */
  .pill {
    display: inline-flex;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--card-soft);
    color: var(--text-soft);
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
  }
  .pill.active {
    background: var(--accent-deep);
    color: var(--on-accent);
    border-color: var(--accent-deep);
  }

  /* Wellbeing scale */
  .scale {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
  }
  .scale button {
    aspect-ratio: 1;
    border-radius: 8px;
    background: var(--card-soft);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-soft);
    transition: all 0.12s ease;
  }
  .scale button.sel {
    background: var(--accent-deep);
    border-color: var(--accent-deep);
    color: var(--on-accent);
  }

  /* Misc */
  .row { display: flex; align-items: center; gap: 8px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .stack-tight { display: flex; flex-direction: column; gap: 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  .small { font-size: 13px; }
  .tiny { font-size: 11px; color: var(--muted); }
  .center { text-align: center; }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 16px 8px;
  }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }

  /* Compare bar chart */
  .bar-row {
    display: grid;
    grid-template-columns: 70px 1fr 36px;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .bar-track {
    height: 12px;
    background: var(--card-soft);
    border-radius: 6px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-deep) 100%);
    border-radius: 6px;
    transition: width 0.3s ease;
  }
  .bar-row .lbl { color: var(--text-soft); font-variant-numeric: tabular-nums; font-size: 12px; }
  .bar-row .val { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0;
    background: var(--modal-bg);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .modal {
    background: var(--card);
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 640px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 24px rgba(60, 40, 23, 0.15);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  /* Week nav */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .week-nav .label-wk {
    text-align: center;
    flex: 1;
  }
  .week-nav .label-wk .top { font-size: 13px; color: var(--muted); }
  .week-nav .label-wk .bot { font-size: 16px; font-weight: 600; color: var(--text); }

  /* Compact habit list (today) */
  .today-habits {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 6px;
  }
  .today-habit {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--card-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }
  .today-habit .ico { font-size: 16px; line-height: 1; flex-shrink: 0; }
  .today-habit .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .today-habit.done {
    background: var(--done-soft);
    border-color: var(--done);
    color: var(--text);
  }
  .today-habit.partial {
    background: var(--partial-soft);
    border-color: var(--partial);
  }
  .today-habit .mark {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--card);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
    flex-shrink: 0;
  }
  .today-habit.done .mark { background: var(--done); border-color: var(--done); }
  .today-habit.partial .mark { background: var(--partial); border-color: var(--partial); }

  /* Tomorrow's one thing card */
  .one-thing {
    background: var(--warm-grad);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .one-thing .lbl-top {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--warm-grad-fg);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .one-thing .text {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
  }

  /* History list */
  .history-item {
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
  }
  .history-item:last-child { border-bottom: none; }

  /* Export */
  pre.export {
    background: var(--card-soft);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 50vh;
    overflow-y: auto;
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* Compare picker */
  .week-pick {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 13px;
    margin-bottom: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .week-pick.sel {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-deep);
  }

  /* Theme toggle + small icon buttons */
  .theme-toggle, .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--card-soft);
    border: 1px solid var(--border);
    color: var(--text-soft);
    font-size: 14px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Streak badge on today habit pills */
  .today-habit .streak {
    font-size: 10px;
    line-height: 1;
    font-weight: 700;
    color: var(--on-accent);
    background: var(--accent-deep);
    flex-shrink: 0;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }

  /* Wellbeing chart */
  .well-chart {
    width: 100%;
    height: 60px;
    display: block;
  }

  /* Heatmap */
  .heatmap-wrap { padding-bottom: 4px; }
  .heatmap {
    display: grid;
    grid-template-rows: repeat(7, minmax(0, 1fr));
    grid-auto-flow: column;
    grid-auto-columns: minmax(0, 1fr);
    gap: 2px;
    width: 100%;
    aspect-ratio: 22 / 7;
  }
  .heatmap-cell {
    border-radius: 3px;
    background: var(--card-soft);
    min-width: 0;
  }

  /* Search */
  .search-result {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .search-result:last-child { border-bottom: none; }
  .search-source {
    font-size: 10px;
    color: var(--accent-deep);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-right: 6px;
  }
  .search-date {
    font-size: 11px;
    color: var(--muted);
  }
  .search-meta { margin-bottom: 4px; }
  .search-text {
    font-size: 14px;
    color: var(--text);
    white-space: pre-wrap;
    line-height: 1.45;
  }
  .search-text mark {
    background: var(--accent-soft);
    color: var(--text);
    padding: 0 2px;
    border-radius: 3px;
  }

  /* Trends sparkline rows */
  .trend-row {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr) 90px 24px 36px;
    gap: 8px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .trend-row:last-child { border-bottom: none; }
  .trend-row .ico { font-size: 16px; text-align: center; line-height: 1; }
  .trend-row .nm  { font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trend-row .arrow { text-align: center; font-size: 14px; font-weight: 600; }
  .trend-row .arrow.up   { color: var(--done); }
  .trend-row .arrow.flat { color: var(--muted); }
  .trend-row .arrow.down { color: var(--accent-deep); }
  .trend-row .avg { text-align: right; font-size: 13px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
  .spark { width: 100%; height: 26px; display: block; }

  /* Keep tappable */
  @media (hover: none) {
    .btn:hover { background: var(--card-soft); }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { h, render, Fragment } from "https://esm.sh/preact@10.19.3";
import { useState, useEffect, useMemo, useRef, useCallback } from "https://esm.sh/preact@10.19.3/hooks";
import htm from "https://esm.sh/htm@3.1.1";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

const html = htm.bind(h);

/* ======================================================================
   SUPABASE CONFIG  ←  fill these two in (see Setup screen for how)

/* ======================================================================
   DATE / TIME UTILITIES (Monday-start weeks, ISO weeks)
   ====================================================================== */

function startOfDay(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  return d;
}

function startOfWeek(date) {
  const d = startOfDay(date);
  const day = d.getDay() || 7; // Sunday → 7
  d.setDate(d.getDate() - day + 1);
  return d;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function dayKey(date) {
  const d = startOfDay(date);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function isoWeekKey(date) {
  // ISO 8601 week (Mon-start, week 1 contains Jan 4)
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
}

function weekDates(weekStart) {
  return Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
}

function dayIndex(date) {
  // Mon=0 ... Sun=6
  const day = date.getDay() || 7;
  return day - 1;
}

function fmtDate(date, opts = { weekday: "long", month: "long", day: "numeric" }) {
  return new Intl.DateTimeFormat("en-US", opts).format(date);
}

function fmtShort(date) {
  return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(date);
}

function fmtWeekRange(weekStart) {
  const end = addDays(weekStart, 6);
  return `${fmtShort(weekStart)} – ${fmtShort(end)}`;
}

/* ======================================================================
   MOON PHASE
   ====================================================================== */

const SYNODIC = 29.530588853;
const REF_NEW_MOON = new Date("2000-01-06T18:14:00Z").getTime();

function moonPhase(date) {
  const days = (date.getTime() - REF_NEW_MOON) / 86400000;
  let pos = ((days % SYNODIC) + SYNODIC) % SYNODIC; // 0..SYNODIC
  const fraction = pos / SYNODIC; // 0..1
  // Center each named phase on its key fraction (k/8). Window of width 1/8.
  const idx = Math.floor((fraction + 1 / 16) * 8) % 8;
  return {
    ...MOON_PHASES[idx],
    daysIntoCycle: pos,
    fraction
  };
}

const initialState = () => ({

  habits: {},

function migrateState(s) {
  // Idempotent habit renames (Stretch/Mobility → Yoga, etc.)
  if (s.habits) {
    for (const wk of Object.keys(s.habits)) {
      const wkObj = s.habits[wk];
      for (const [oldName, newName] of Object.entries(HABIT_RENAMES)) {
        if (wkObj[oldName] === undefined) continue;
        if (wkObj[newName]) {
          // Both exist — take max per day so no data is lost
          const a = wkObj[oldName], b = wkObj[newName];
          for (let i = 0; i < 7; i++) b[i] = Math.max(b[i] || 0, a[i] || 0);
        } else {
          wkObj[newName] = wkObj[oldName];
        }
        delete wkObj[oldName];
      }
    }
  }
  // openReflection → stoodOut (split into 3 fields). Idempotent.
  if (s.reviews) {
    for (const r of Object.values(s.reviews)) {
      if (r && r.openReflection && !r.stoodOut && !r.wasAlive && !r.attention) {
        r.stoodOut = r.openReflection;
        delete r.openReflection;
      }
    }
  }
  return s;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return initialState();
    const parsed = JSON.parse(raw);
    return migrateState({ ...initialState(), ...parsed });
  } catch (e) {
    console.warn("Failed to load state, starting fresh:", e);
    return initialState();
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn("Failed to save state:", e);
  }
}

function isStateEmpty(s) {
  if (!s) return true;
  return (
    Object.keys(s.habits || {}).length === 0 &&
    Object.keys(s.moonNotes || {}).length === 0 &&
    Object.keys(s.geneKeys || {}).length === 0 &&
    Object.keys(s.checkins || {}).length === 0 &&
    Object.keys(s.reviews || {}).length === 0 &&
    Object.keys(s.intentions?.weekly || {}).length === 0 &&
    Object.keys(s.intentions?.daily || {}).length === 0 &&
    !s.intentions?.nextWeek
  );
}

async function loadCloudState(userId) {

    .from("user_state")

function weekHabitData(state, weekKey) {
  return state.habits[weekKey] || {};
}

function getHabitValue(state, weekKey, habit, dIdx) {
  const wk = state.habits[weekKey];
  if (!wk || !wk[habit]) return 0;
  return wk[habit][dIdx] ?? 0;
}

function setHabitValue(state, weekKey, habit, dIdx, value) {
  const habits = { ...state.habits };
  const wk = { ...(habits[weekKey] || {}) };
  const arr = wk[habit] ? [...wk[habit]] : Array(7).fill(0);
  arr[dIdx] = value;
  wk[habit] = arr;
  habits[weekKey] = wk;
  return { ...state, habits };
}

function cycleHabitValue(v) {
  if (v === 0) return 1;
  if (v === 1) return 0.5;
  return 0;
}

function habitWeekTotal(state, weekKey, habit) {
  const arr = (state.habits[weekKey] || {})[habit];
  if (!arr) return 0;
  return arr.reduce((s, v) => s + (v || 0), 0);
}

function habitWeekBreakdown(state, weekKey, habit) {
  const arr = (state.habits[weekKey] || {})[habit] || Array(7).fill(0);
  let full = 0, partial = 0;
  for (const v of arr) {
    if (v === 1) full++;
    else if (v === 0.5) partial++;
  }
  return { full, partial, total: full + partial * 0.5 };
}

function habitStreak(state, habit, today) {
  // Counts consecutive days ending today (or yesterday if today not yet logged)
  // with value > 0. Partials (0.5) keep the streak alive.
  let streak = 0;
  let d = new Date(today);
  const todayWk = isoWeekKey(d);
  const todayIdx = dayIndex(d);
  const todayVal = (state.habits[todayWk]?.[habit] || [])[todayIdx] || 0;
  if (todayVal > 0) streak++;
  d = addDays(d, -1);
  for (let i = 0; i < 365; i++) {
    const wk = isoWeekKey(d);
    const idx = dayIndex(d);
    const v = (state.habits[wk]?.[habit] || [])[idx] || 0;
    if (v > 0) { streak++; d = addDays(d, -1); }
    else break;
  }
  return streak;
}

function searchAll(state, query) {
  if (!query || !query.trim()) return [];
  const q = query.toLowerCase();
  const hit = (text) => text && typeof text === "string" && text.toLowerCase().includes(q);
  const results = [];

  for (const [dk, c] of Object.entries(state.checkins || {})) {
    if (!c) continue;
    const fields = [
      ["What happened",       c.whatHappened],
      ["Wellbeing reason",    c.wellbeingWhy],
      ["Stillness",           c.stillness],
      ["What gave me energy", c.energy],
      ["Visibility",          c.visibility], // legacy
      ["Connection",          c.connection],
      ["Body notes",          c.bodyNotes],
      ["Creative pulse",      c.creative?.pulse],
      ["Tomorrow's one thing", c.tomorrowOneThing]
    ];
    for (const [label, text] of fields) {
      if (hit(text)) results.push({ dateKey: dk, sortKey: dk, source: label, text });
    }
    (c.gratitude || []).forEach((g, i) => {
      if (hit(g)) results.push({ dateKey: dk, sortKey: dk, source: `Gratitude ${i + 1}`, text: g });
    });
  }
  for (const [dk, note] of Object.entries(state.moonNotes || {})) {
    if (hit(note)) results.push({ dateKey: dk, sortKey: dk, source: "Moon note", text: note });
  }
  for (const [dk, t] of Object.entries(state.intentions?.daily || {})) {
    if (hit(t)) results.push({ dateKey: dk, sortKey: dk, source: "Daily one thing", text: t });
  }
  for (const [wk, arr] of Object.entries(state.intentions?.weekly || {})) {
    (arr || []).forEach((it, i) => {
      if (hit(it)) results.push({ dateKey: wk, sortKey: wk, source: `Weekly intention ${i + 1}`, text: it });
    });
  }
  for (const [wk, gk] of Object.entries(state.geneKeys || {})) {
    if (gk?.logs) {
      for (const [dk, log] of Object.entries(gk.logs)) {
        if (hit(log)) results.push({ dateKey: dk, sortKey: dk, source: `Gene Key ${gk.number || "?"} noticing`, text: log });
      }
    }
    if (hit(gk?.shadow))       results.push({ dateKey: wk, sortKey: wk, source: "Gene Key Shadow",       text: gk.shadow });
    if (hit(gk?.gift))         results.push({ dateKey: wk, sortKey: wk, source: "Gene Key Gift",         text: gk.gift });
    if (hit(gk?.siddhi))       results.push({ dateKey: wk, sortKey: wk, source: "Gene Key Siddhi",       text: gk.siddhi });
    if (hit(gk?.weeklyNotes))  results.push({ dateKey: wk, sortKey: wk, source: "Gene Key — what I've learned", text: gk.weeklyNotes });
  }
  for (const [wk, r] of Object.entries(state.reviews || {})) {
    if (hit(r?.geneKeyReflection)) results.push({ dateKey: wk, sortKey: wk, source: "Gene Key reflection", text: r.geneKeyReflection });
    if (hit(r?.stoodOut))          results.push({ dateKey: wk, sortKey: wk, source: "What stood out",      text: r.stoodOut });
    if (hit(r?.wasAlive))          results.push({ dateKey: wk, sortKey: wk, source: "What was alive",      text: r.wasAlive });
    if (hit(r?.attention))         results.push({ dateKey: wk, sortKey: wk, source: "Wants attention",     text: r.attention });
    if (hit(r?.openReflection))    results.push({ dateKey: wk, sortKey: wk, source: "Weekly reflection",   text: r.openReflection }); // legacy
  }

  results.sort((a, b) => b.sortKey.localeCompare(a.sortKey));
  return results;
}

function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function highlightHtml(text, query) {
  if (!query.trim()) return text;
  const parts = text.split(new RegExp(`(${escapeRegex(query)})`, "gi"));
  return parts.map((p, i) =>
    p.toLowerCase() === query.toLowerCase()
      ? html`<mark key=${i}>${p}</mark>`
      : p
  );
}

function SignedInApp({ session, theme, toggleTheme }) {
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState("today");
  const [hydrated, setHydrated] = useState(false);
  const [syncStatus, setSyncStatus] = useState("idle"); // 'idle' | 'saving' | 'saved' | 'offline'
  const [showSearch, setShowSearch] = useState(false);
  const today = useMemo(() => startOfDay(new Date()), []);
  const todayWeek = useMemo(() => startOfWeek(today), [today]);
  const todayWeekKey = isoWeekKey(today);
  const userId = session.user.id;

  // Refs to avoid save loops & feedback from realtime
  const lastCloudJsonRef = useRef(null);
  const saveTimerRef = useRef(null);

  // Auto-grow textareas to fit content.
  // Two-tier strategy to prevent the page from jumping while you type:
  //   - After every render: only GROW textareas that need more room.
  //     Never reset to "auto" here — doing so briefly collapses each
  //     textarea before regrowing, which forces the browser to reflow
  //     and re-scroll the focused field, making it appear to "move up".
  //   - On user input: do the full reset+regrow for ONLY the focused
  //     textarea so it can also SHRINK when you delete characters.
  useEffect(() => {
    document.querySelectorAll("textarea").forEach((el) => {
      if (el.scrollHeight > el.offsetHeight) {
        el.style.height = el.scrollHeight + "px";
      }
    });
  });
  useEffect(() => {
    const fit = (el) => {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    };
    const onInput = (e) => {
      if (e.target && e.target.tagName === "TEXTAREA") fit(e.target);
    };
    const onResize = () => {
      document.querySelectorAll("textarea").forEach(fit);
    };
    document.addEventListener("input", onInput);
    window.addEventListener("resize", onResize);
    return () => {
      document.removeEventListener("input", onInput);
      window.removeEventListener("resize", onResize);
    };
  }, []);

  // Initial cloud hydration: cloud is source of truth on load.
  // If cloud is empty but local has data, upload local.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const row = await loadCloudState(userId);
        if (cancelled) return;
        if (row && row.data && !isStateEmpty(row.data)) {
          const migrated = migrateState(row.data);
          setState(migrated);
          lastCloudJsonRef.current = JSON.stringify(migrated);
          saveState(migrated);
        } else if (!isStateEmpty(state)) {
          // Cloud empty, local has data → upload as initial cloud state
          await saveCloudState(userId, state);
          lastCloudJsonRef.current = JSON.stringify(state);
        } else {
          lastCloudJsonRef.current = JSON.stringify(state);
        }
      } catch (err) {
        console.warn("Cloud hydrate failed, using local cache:", err);
        setSyncStatus("offline");
      } finally {
        if (!cancelled) setHydrated(true);
      }
    })();
    return () => { cancelled = true; };
  }, [userId]);

  // Realtime: when our row changes from another session, pull it in
  useEffect(() => {
    if (!supabase || !userId) return;
    const channel = supabase
      .channel(`user_state:${userId}`)
      .on("postgres_changes", {
        event: "*",
        schema: "public",
        table: "user_state",
        filter: `user_id=eq.${userId}`
      }, (payload) => {
        const remote = payload.new?.data;
        if (!remote) return;
        const remoteJson = JSON.stringify(remote);
        if (remoteJson === lastCloudJsonRef.current) return; // echo of our own write
        lastCloudJsonRef.current = remoteJson;
        const migrated = migrateState(remote);
        setState(migrated);
        saveState(migrated);
      })
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [userId]);

  // Persist to local immediately + debounced cloud save
  useEffect(() => {
    if (!hydrated) return;
    saveState(state);
    const json = JSON.stringify(state);
    if (json === lastCloudJsonRef.current) return;

    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    setSyncStatus("saving");
    saveTimerRef.current = setTimeout(async () => {
      try {
        await saveCloudState(userId, state);
        lastCloudJsonRef.current = json;
        setSyncStatus("saved");
        setTimeout(() => setSyncStatus(s => s === "saved" ? "idle" : s), 1200);
      } catch (err) {
        console.warn("Cloud save failed:", err);
        setSyncStatus("offline");
      }
    }, 700);
    return () => clearTimeout(saveTimerRef.current);
  }, [state, hydrated, userId]);

  const patch = useCallback((updater) => {
    setState((s) => (typeof updater === "function" ? updater(s) : { ...s, ...updater }));
  }, []);

  const ctx = { state, patch, today, todayWeek, todayWeekKey, session, syncStatus };

  return html`
    <${Header}
      today=${today}
      tab=${tab}
      session=${session}
      syncStatus=${syncStatus}
      theme=${theme}
      toggleTheme=${toggleTheme}
      onSearch=${() => setShowSearch(true)}
    />
    <div class="scroll">
      ${tab === "today"   && html`<${TodayView}    ...${ctx} />`}
      ${tab === "habits"  && html`<${HabitsView}   ...${ctx} />`}
      ${tab === "moon"    && html`<${MoonView}     ...${ctx} />`}
      ${tab === "keys"    && html`<${KeysView}     ...${ctx} />`}
      ${tab === "plans"   && html`<${PlansView}    ...${ctx} />`}
      ${tab === "review"  && html`<${ReviewView}   ...${ctx} />`}
    </div>
    <${TabBar} tab=${tab} setTab=${setTab} />
    ${showSearch && html`<${SearchModal} state=${state} onClose=${() => setShowSearch(false)} />`}
  `;
}

/* ======================================================================
   SIGN IN
   ====================================================================== */

function SignIn() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [mode, setMode] = useState("signin"); // 'signin' | 'signup'
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setInfo(""); setBusy(true);
    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) setErr(error.message);
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) setErr(error.message);
        else if (!data.session) {
          setInfo("Check your email to confirm, then come back and sign in.");
        }
      }
    } catch (e2) {
      setErr(String(e2));
    } finally {
      setBusy(false);
    }
  };

  return html`
    <header class="header">
      <div class="date">Life Tracker</div>
      <div class="title">${mode === "signin" ? "Sign in" : "Create account"}</div>
    </header>
    <div class="scroll" style="max-width:420px;margin:0 auto">
      <form onSubmit=${submit} class="card">
        <div class="field">
          <label class="label">Email</label>
          <input
            class="input"
            type="email"
            autocomplete="email"
            required
            value=${email}
            onInput=${e => setEmail(e.target.value)}
          />
        </div>
        <div class="field">
          <label class="label">Password</label>
          <input
            class="input"
            type="password"
            autocomplete=${mode === "signin" ? "current-password" : "new-password"}
            required
            minlength="6"
            value=${password}
            onInput=${e => setPassword(e.target.value)}
          />
        </div>
        ${err && html`<p class="small" style="color:var(--error);margin-bottom:10px">${err}</p>`}
        ${info && html`<p class="small" style="color:var(--accent-deep);margin-bottom:10px">${info}</p>`}
        <button class="btn btn-primary btn-block" disabled=${busy} type="submit">
          ${busy ? "…" : (mode === "signin" ? "Sign in" : "Sign up")}
        </button>
      </form>
      <button
        class="btn btn-ghost btn-block"
        style="margin-top:12px"
        onClick=${() => { setMode(mode === "signin" ? "signup" : "signin"); setErr(""); setInfo(""); }}
      >
        ${mode === "signin" ? "No account? Create one" : "Have an account? Sign in"}
      </button>
      <p class="tiny center" style="margin-top:24px">
        Your data is private to your account. Synced across devices.
      </p>
    </div>
  `;
}

function TodayView({ state, patch, today, todayWeek, todayWeekKey }) {
  const [selectedDate, setSelectedDate] = useState(today);
  const isToday      = dayKey(selectedDate) === dayKey(today);
  const isYesterday  = dayKey(selectedDate) === dayKey(addDays(today, -1));
  const selectedKey  = dayKey(selectedDate);
  const selectedWk   = isoWeekKey(selectedDate);
  const dIdx         = dayIndex(selectedDate);
  const dow          = selectedDate.getDay(); // 0=Sun, 2=Tue, 4=Thu

  const dayLabel = isToday ? "Today"
    : isYesterday ? "Yesterday"
    : fmtDate(selectedDate, { weekday: "long" });

  // Tue/Thu reminder banner: only on real today
  const showBanner = isToday && (dow === 2 || dow === 4);
  const weeklyIntentions = state.intentions.weekly[selectedWk] || [];
  const oneThing = state.intentions.daily[selectedKey] || "";

  const checkin = state.checkins[selectedKey] || {};
  const setCheckinField = (k, v) => patch(s => ({
    ...s,
    checkins: { ...s.checkins, [selectedKey]: { ...(s.checkins[selectedKey] || {}), [k]: v } }
  }));

  // "Tomorrow's one thing" reads/writes to intentions.daily of the day AFTER selectedDate
  const nextDayKey = dayKey(addDays(selectedDate, 1));
  const tomorrowOneThing = state.intentions.daily[nextDayKey] || "";
  const setTomorrowOneThing = (v) => patch(s => ({
    ...s,
    intentions: { ...s.intentions, daily: { ...s.intentions.daily, [nextDayKey]: v } }
  }));

  // Gene Key for the selected week
  const gk = state.geneKeys[selectedWk];

  const cycleHabit = (habit) => {
    const cur = getHabitValue(state, selectedWk, habit, dIdx);
    const next = cycleHabitValue(cur);
    patch(s => setHabitValue(s, selectedWk, habit, dIdx, next));
  };

  return html`
    <div class="week-nav">
      <button class="btn btn-icon" onClick=${() => setSelectedDate(addDays(selectedDate, -1))} aria-label="Previous day">‹</button>
      <div class="label-wk">

      </div>
      <button
        class="btn btn-icon"
        onClick=${() => setSelectedDate(addDays(selectedDate, 1))}
        disabled=${isToday}
        style=${isToday ? "opacity:0.35" : ""}
        aria-label="Next day"
      >›</button>
    </div>
    ${!isToday && html`
      <button class="btn btn-ghost btn-block" style="margin-top:-4px;margin-bottom:8px;font-size:12px" onClick=${() => setSelectedDate(today)}>
        Jump to today

    `}

    ${showBanner && (weeklyIntentions.some(Boolean) || oneThing) && html`
      <div class="banner">
        <h3>${dow === 2 ? "Tuesday" : "Thursday"} reminder</h3>
        ${oneThing && html`<p style="font-weight:500;margin-bottom:6px">Today: ${oneThing}</p>`}
        ${weeklyIntentions.some(Boolean) && html`
          <ul>
            ${weeklyIntentions.filter(Boolean).map((i, k) => html`<li key=${k}>${i}</li>`)}
          </ul>
        `}
      </div>
    `}

    ${oneThing && html`
      <div class="one-thing">
        <div class="lbl-top">${isToday ? "Today's one thing" : `${dayLabel}'s one thing`}</div>
        <div class="text">${oneThing}</div>
      </div>
    `}

    <div class="card">
      <h2>Habits ${isToday ? "today" : `· ${fmtShort(selectedDate)}`}</h2>
      <p class="muted small" style="margin-bottom:12px">Tap to cycle: empty → done → half</p>
      <div class="today-habits">
        ${HABITS.map(h => {
          const v = getHabitValue(state, selectedWk, h, dIdx);
          const cls = v === 1 ? "done" : v === 0.5 ? "partial" : "";
          const mark = v === 1 ? "✓" : v === 0.5 ? "½" : "";
          const streak = isToday ? habitStreak(state, h, today) : 0;
          return html`
            <button key=${h} class="today-habit ${cls}" onClick=${() => cycleHabit(h)}>
              <span class="ico">${HABIT_ICONS[h] || ""}</span>
              <span class="name">${h}</span>

              <span class="mark">${mark}</span>
            </button>
          `;
        })}
      </div>
    </div>

    ${gk && html`
      <div class="card">
        <h2>Gene Key prompt</h2>
        <p class="small" style="margin-bottom:10px;color:var(--text-soft)">
          Where did I notice <strong style="color:var(--accent-deep)">${gk.shadow || "the Shadow"}</strong> or <strong style="color:var(--done)">${gk.gift || "the Gift"}</strong> ${isToday ? "today" : `on ${fmtShort(selectedDate)}`}?
        </p>

          class="textarea"
          rows="3"
          placeholder="A moment, a feeling, a noticing..."
          value=${(gk.logs && gk.logs[selectedKey]) || ""}
          onInput=${(e) => patch(s => {
            const keys = { ...s.geneKeys };
            const k = { ...(keys[selectedWk] || {}) };

            return { ...s, geneKeys: keys };

    <${EveningCheckIn}

      class="btn btn-ghost btn-block"
      style="margin-top:8px;font-size:12px"
      onClick=${async () => {
        if (!confirm("Reset all data? This wipes your cloud row too. Cannot be undone.")) return;
        try {
          if (supabase && state) {
            const { data: { session: s } } = await supabase.auth.getSession();
            if (s?.user?.id) {
              await supabase.from("user_state").delete().eq("user_id", s.user.id);

          console.warn("Cloud reset failed:", e);
        }
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }}
    >Reset all data</button>
  `;
}

/* All-habit trends — sparkline per habit, with up/sideways/down indicator */
function TrendsModal({ state, onClose }) {
  const [windowSize, setWindowSize] = useState(8); // weeks to show
  const today = startOfDay(new Date());

  // Build the window: an array of week-keys ending with this week, going back `windowSize` weeks.
  // Pads with empty weeks if data doesn't reach that far — so the time axis is always meaningful.
  const weeks = useMemo(() => {
    const arr = [];
    for (let i = windowSize - 1; i >= 0; i--) {
      const weekStart = startOfWeek(addDays(today, -7 * i));
      arr.push({ key: isoWeekKey(weekStart), start: weekStart });
    }
    return arr;
  }, [windowSize, today.getTime()]);

  const windowStart = weeks[0].start;
  const windowEnd = addDays(weeks[weeks.length - 1].start, 6);

  return html`
    <div class="modal-bg" onClick=${onClose}>
      <div class="modal" onClick=${e => e.stopPropagation()}>
        <div class="modal-header">
          <h2>Habit trends</h2>
          <button class="btn btn-ghost btn-icon" onClick=${onClose}>✕</button>
        </div>

        <div class="row" style="gap:6px;margin-bottom:8px">
          ${[4, 8, 12, 26].map(n => html`
            <button
              key=${n}
              class="pill ${windowSize === n ? "active" : ""}"
              onClick=${() => setWindowSize(n)}
            >${n}w</button>
          `)}
        </div>
        <p class="tiny" style="margin:0 0 12px;color:var(--text-soft)">
          ${windowSize} weeks · ${fmtShort(windowStart)} – ${fmtShort(windowEnd)}
        </p>

        <div>
          ${HABITS.map(h => {
            const totals = weeks.map(({ key }) => habitWeekTotal(state, key, h));
            const dataCount = totals.filter(v => v > 0).length;
            const trend = dataCount >= 3 ? computeTrend(totals) : { arrow: "·", cls: "flat" };
            const avg = dataCount > 0
              ? totals.reduce((a, b) => a + b, 0) / totals.length
              : 0;
            return html`
              <div class="trend-row" key=${h}>
                <div class="ico">${HABIT_ICONS[h] || ""}</div>
                <div class="nm">${h}</div>
                <${Sparkline} values=${totals} max=${7} />
                <div class="arrow ${trend.cls}">${trend.arrow}</div>
                <div class="avg">${avg.toFixed(1)}</div>
              </div>
            `;
          })}
          <p class="tiny" style="margin-top:10px">
            Each spark covers ${windowSize} weeks ending this week.
            Arrow shows trend once you have 3+ active weeks.
            Avg = mean of weekly totals (max 7).
          </p>
        </div>
      </div>
    </div>
  `;
}

function computeTrend(values) {
  // Simple linear-regression slope. Threshold ±0.15/wk for up/down.
  const n = values.length;
  if (n < 2) return { arrow: "→", cls: "flat" };
  const meanX = (n - 1) / 2;
  const meanY = values.reduce((a, b) => a + b, 0) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) {
    num += (i - meanX) * (values[i] - meanY);
    den += (i - meanX) ** 2;
  }
  const slope = den === 0 ? 0 : num / den;
  if (slope >  0.15) return { arrow: "↗", cls: "up" };
  if (slope < -0.15) return { arrow: "↘", cls: "down" };
  return { arrow: "→", cls: "flat" };
}

function Sparkline({ values, max = 7 }) {
  const w = 90, h = 26, pad = 2;
  const n = values.length;
  if (n < 2) {
    return html`<svg class="spark" viewBox=${`0 0 ${w} ${h}`}></svg>`;
  }
  const innerW = w - pad * 2;
  const innerH = h - pad * 2;
  const xs = (i) => pad + (i / (n - 1)) * innerW;
  const ys = (v) => pad + innerH - (Math.min(v, max) / max) * innerH;
  const points = values.map((v, i) => `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(" ");
  const lastX = xs(n - 1);
  const lastY = ys(values[n - 1]);
  // shaded area under line
  const areaPts = `${pad},${h - pad} ${points} ${(w - pad)},${h - pad}`;
  return html`
    <svg class="spark" viewBox=${`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polygon points=${areaPts} fill="var(--accent-soft)" />
      <polyline points=${points} fill="none" stroke="var(--accent-deep)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx=${lastX} cy=${lastY} r="2" fill="var(--accent-deep)" />
    </svg>
  `;
}

/* ======================================================================
   EXPORT MODAL
   ====================================================================== */

function parseISODate(s) {
  if (!s) return null;
  const [y, m, d] = s.split("-").map(n => parseInt(n, 10));
  if (!y || !m || !d) return null;
  const dt = new Date(y, m - 1, d);
  dt.setHours(0, 0, 0, 0);
  return dt;
}

function ExportModal({ state, defaultStart, defaultEnd, onClose }) {
  const [start, setStart] = useState(dayKey(defaultStart));
  const [end,   setEnd]   = useState(dayKey(defaultEnd));
  const [copied, setCopied] = useState(false);

  const startDate = parseISODate(start);
  const endDate   = parseISODate(end);
  const valid = startDate && endDate && startDate <= endDate;

  const summary = useMemo(() => {
    if (!valid) return "Pick a valid range — start must be on or before end.";
    return buildRangeSummary(state, startDate, endDate);
  }, [state, start, end]);

  const setQuick = (preset) => {
    const t = startOfDay(new Date());
    if (preset === "week") {
      setStart(dayKey(startOfWeek(t)));
      setEnd(dayKey(t));
    } else if (preset === "4w") {
      setStart(dayKey(addDays(t, -27)));
      setEnd(dayKey(t));
    } else if (preset === "12w") {
      setStart(dayKey(addDays(t, -83)));
      setEnd(dayKey(t));
    } else if (preset === "month") {
      const d = new Date(t); d.setDate(1);
      setStart(dayKey(d));
      setEnd(dayKey(t));
    } else if (preset === "year") {
      const d = new Date(t); d.setMonth(0, 1);
      setStart(dayKey(d));
      setEnd(dayKey(t));
    } else if (preset === "all") {
      const allKeys = [
        ...Object.keys(state.checkins || {}),
        ...Object.keys(state.moonNotes || {}),
        ...Object.keys(state.intentions?.daily || {})
      ];
      // Also pull earliest day from any habit week-start
      for (const wk of Object.keys(state.habits || {})) {
        const m = wk.match(/^(\d{4})-W(\d{2})$/);
        if (m) {
          const yr = parseInt(m[1]); const w = parseInt(m[2]);
          const jan4 = new Date(yr, 0, 4);
          const target = addDays(startOfWeek(jan4), (w - 1) * 7);
          allKeys.push(dayKey(target));
        }
      }
      const earliest = allKeys.length ? allKeys.sort()[0] : dayKey(startOfWeek(t));
      setStart(earliest);
      setEnd(dayKey(t));
    }
  };

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(summary);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = summary;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch {}
      document.body.removeChild(ta);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };
  const download = () => {
    const blob = new Blob([summary], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `life-tracker-${start}_to_${end}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return html`
    <div class="modal-bg" onClick=${onClose}>
      <div class="modal" onClick=${e => e.stopPropagation()}>
        <div class="modal-header">
          <h2>Export</h2>
          <button class="btn btn-ghost btn-icon" onClick=${onClose}>✕</button>
        </div>

        <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">
          <button class="pill" onClick=${() => setQuick("week")}>This week</button>
          <button class="pill" onClick=${() => setQuick("4w")}>4 weeks</button>
          <button class="pill" onClick=${() => setQuick("12w")}>12 weeks</button>
          <button class="pill" onClick=${() => setQuick("month")}>This month</button>
          <button class="pill" onClick=${() => setQuick("year")}>This year</button>
          <button class="pill" onClick=${() => setQuick("all")}>All time</button>
        </div>

        <div class="row" style="gap:8px;margin-bottom:12px">
          <div style="flex:1">
            <label class="label">From</label>
            <input class="input" type="date" value=${start} onInput=${e => setStart(e.target.value)} />
          </div>
          <div style="flex:1">
            <label class="label">To</label>
            <input class="input" type="date" value=${end} onInput=${e => setEnd(e.target.value)} />
          </div>
        </div>

        <pre class="export">${summary}</pre>
        <div class="row" style="margin-top:12px;gap:8px">
          <button class="btn btn-primary" style="flex:1" onClick=${copy} disabled=${!valid}>${copied ? "Copied" : "Copy"}</button>
          <button class="btn" style="flex:1" onClick=${download} disabled=${!valid}>Download .md</button>
        </div>
      </div>
    </div>
  `;
}

/* ======================================================================
   RANGE SUMMARY BUILDER
   ====================================================================== */

function buildRangeSummary(state, startDate, endDate) {
  const lines = [];
  lines.push(`# Life Tracker · ${fmtShort(startDate)} – ${fmtShort(endDate)}`);
  const dayCount = Math.round((endDate - startDate) / 86400000) + 1;
  lines.push(`${dayCount} day${dayCount === 1 ? "" : "s"}`);
  lines.push("");

  // Collect days in range (inclusive)
  const days = [];
  for (let d = new Date(startDate); d <= endDate; d = addDays(d, 1)) {
    days.push(new Date(d));
  }

  // Collect ISO weeks touched by range
  const weekSet = new Set();
  for (const d of days) weekSet.add(isoWeekKey(d));
  const weekKeys = [...weekSet].sort();

  // ============ Habits — totals by week ============
  const habitWeeks = weekKeys.filter(wk => state.habits[wk]);
  if (habitWeeks.length) {
    lines.push("## Habits");
    for (const wk of habitWeeks) {
      const totals = HABITS
        .map(h => ({ h, ...habitWeekBreakdown(state, wk, h) }))
        .filter(({ total }) => total > 0);
      if (!totals.length) continue;
      lines.push(`### ${wk}`);
      for (const { h, full, partial, total } of totals) {
        lines.push(`- ${h}: ${total} (${full} full + ${partial} half)`);
      }
      lines.push("");
    }
  }

  // ============ Weekly intentions, Gene Keys, reviews ============
  const weekDataLines = [];
  for (const wk of weekKeys) {
    const weekly = state.intentions.weekly[wk];
    const review = state.reviews[wk];
    const gk = state.geneKeys[wk];
    const hasContent = (weekly && weekly.some(Boolean)) || (gk && gk.number) || review;
    if (!hasContent) continue;
    weekDataLines.push(`### ${wk}`);
    if (weekly && weekly.some(Boolean)) {
      const checks = review?.intentionChecks || [];
      weekDataLines.push("**Intentions:**");
      weekly.forEach((it, i) => {
        if (!it) return;
        const mark = checks[i] ? "[x]" : "[ ]";
        weekDataLines.push(`- ${mark} ${it}`);
      });
    }
    if (gk && gk.number) {
      weekDataLines.push("");
      weekDataLines.push(`**Gene Key ${gk.number}:** Shadow ${gk.shadow || "—"} · Gift ${gk.gift || "—"} · Siddhi ${gk.siddhi || "—"}`);
      if (gk.weeklyNotes) {
        weekDataLines.push(`**What I've learned about Gene Key ${gk.number}:** ${gk.weeklyNotes}`);
      }
      if (review?.geneKeyReflection) {
        weekDataLines.push(`**Gene Key reflection:** ${review.geneKeyReflection}`);
      }
    }
    if (review?.stoodOut)  { weekDataLines.push(""); weekDataLines.push(`**What stood out:** ${review.stoodOut}`); }
    if (review?.wasAlive)  { weekDataLines.push(""); weekDataLines.push(`**What was alive:** ${review.wasAlive}`); }
    if (review?.attention) { weekDataLines.push(""); weekDataLines.push(`**What wants attention next week:** ${review.attention}`); }
    weekDataLines.push("");
  }
  if (weekDataLines.length) {
    lines.push("## Weeks");
    lines.push(...weekDataLines);
  }

  // ============ Daily ============
  const dailyLines = [];
  for (const d of days) {
    const dk = dayKey(d);
    const c = state.checkins[dk];
    const mn = state.moonNotes[dk];
    const oneThing = state.intentions.daily?.[dk];
    const wk = isoWeekKey(d);
    const gkLog = state.geneKeys[wk]?.logs?.[dk];

    const hasC = c && Object.values(c).some(v =>
      v && (typeof v === "string" ? v.trim() : (Array.isArray(v) ? v.some(Boolean) : true))
    );
    if (!hasC && !mn && !oneThing && !gkLog) continue;

    dailyLines.push(`### ${fmtDate(d, { weekday: "long", month: "short", day: "numeric", year: "numeric" })}`);
    if (oneThing) dailyLines.push(`- One thing: ${oneThing}`);
    if (c?.wellbeing) dailyLines.push(`- Wellbeing: ${c.wellbeing}/10${c.wellbeingWhy ? ` — ${c.wellbeingWhy}` : ""}`);
    if (c?.whatHappened) dailyLines.push(`- What happened: ${c.whatHappened}`);
    if (c?.stillness) dailyLines.push(`- Stillness: ${c.stillness}`);
    if (c?.energy) dailyLines.push(`- What gave me energy: ${c.energy}`);
    if (c?.visibility) dailyLines.push(`- Visibility/connection: ${c.visibility}`); // legacy
    if (c?.connection) dailyLines.push(`- Who I connected with: ${c.connection}`);
    if (c?.bodyNotes) dailyLines.push(`- Body: ${c.bodyNotes}`);
    if (c?.creative?.status) dailyLines.push(`- Creative: ${c.creative.status}${c.creative.pulse ? ` — ${c.creative.pulse}` : ""}`);
    if (c?.gratitude && c.gratitude.some(Boolean)) {
      dailyLines.push(`- Grateful: ${c.gratitude.filter(Boolean).join("; ")}`);
    }
    if (c?.tomorrowOneThing) dailyLines.push(`- Tomorrow's one thing: ${c.tomorrowOneThing}`);
    if (gkLog) dailyLines.push(`- Gene Key noticing: ${gkLog}`);
    if (mn) {
      const phase = moonPhase(d);
      dailyLines.push(`- Moon (${phase.emoji} ${phase.name}): ${mn}`);
    }
    dailyLines.push("");
  }
  if (dailyLines.length) {
    lines.push("## Daily");
    lines.push(...dailyLines);
  }

  if (lines.length <= 3) {
    lines.push("_No data in this range._");
  }

  return lines.join("\n");
}

/* ======================================================================
   WELLBEING CHART
   ====================================================================== */

function WellbeingChart({ checkins, endDate, days = 14, height = 60 }) {
  const end = startOfDay(endDate || new Date());
  const start = addDays(end, -(days - 1));
  const points = [];
  for (let i = 0; i < days; i++) {
    const d = addDays(start, i);
    const v = checkins[dayKey(d)]?.wellbeing;
    points.push({ date: d, value: typeof v === "number" ? v : null });
  }
  const filled = points.filter(p => p.value !== null);
  if (filled.length < 2) {
    return html`<p class="muted small">Need at least 2 days of wellbeing logs.</p>`;
  }

  const w = 320, h = height, pad = 6;
  const innerW = w - pad * 2;
  const innerH = h - pad * 2;
  const xs = (i) => pad + (i / (days - 1)) * innerW;
  const ys = (v) => pad + innerH - ((v - 1) / 9) * innerH;

  // Path with gaps for missing days
  let d = "";
  let inSeg = false;
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (p.value !== null) {
      d += (inSeg ? " L " : "M ") + xs(i).toFixed(1) + " " + ys(p.value).toFixed(1) + " ";
      inSeg = true;
    } else {
      inSeg = false;
    }
  }

  return html`
    <svg class="well-chart" viewBox=${`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <line x1=${pad} y1=${ys(5)} x2=${w - pad} y2=${ys(5)} stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3 3"/>
      <path d=${d} fill="none" stroke="var(--accent-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${points.map((p, i) => p.value !== null && html`
        <circle key=${i} cx=${xs(i).toFixed(1)} cy=${ys(p.value).toFixed(1)} r="2.5" fill="var(--accent-deep)"/>
      `)}
    </svg>
  `;
}

function WeekWellbeingCard({ state, weekStart }) {
  const days = weekDates(weekStart);
  let count = 0, sum = 0;
  for (const d of days) {
    const v = state.checkins[dayKey(d)]?.wellbeing;
    if (typeof v === "number") { count++; sum += v; }
  }
  if (count < 2) return null;
  const avg = sum / count;
  const endDate = days[6];
  return html`
    <div class="card">
      <div class="row-between" style="margin-bottom:8px">
        <h2 style="margin:0">Wellbeing this week</h2>
        <span class="small" style="color:var(--text-soft)">avg ${avg.toFixed(1)}/10</span>
      </div>
      <${WellbeingChart} checkins=${state.checkins} endDate=${endDate} days=${7} />
    </div>
  `;
}

function WellbeingCard({ checkins, days = 14, title }) {
  const end = startOfDay(new Date());
  const start = addDays(end, -(days - 1));
  let count = 0, sum = 0;
  for (let i = 0; i < days; i++) {
    const v = checkins[dayKey(addDays(start, i))]?.wellbeing;
    if (typeof v === "number") { count++; sum += v; }
  }
  if (count < 2) return null;
  const avg = sum / count;
  return html`
    <div class="card">
      <div class="row-between" style="margin-bottom:8px">
        <h2 style="margin:0">${title || `Wellbeing · ${days} days`}</h2>
        <span class="small" style="color:var(--text-soft)">avg ${avg.toFixed(1)}/10</span>
      </div>
      <${WellbeingChart} checkins=${checkins} days=${days} />
    </div>
  `;
}

/* ======================================================================
   YEAR HEATMAP MODAL
   ====================================================================== */

function HeatmapModal({ state, onClose }) {
  const [habit, setHabit] = useState("_combined");
  const today = startOfDay(new Date());
  const weeksBack = 22;
  const start = startOfWeek(addDays(today, -(weeksBack * 7 - 1)));

  const cells = useMemo(() => {
    const arr = [];
    for (let d = new Date(start); d <= today; d = addDays(d, 1)) {
      const wk = isoWeekKey(d);
      const idx = dayIndex(d);
      let v;
      if (habit === "_combined") {
        let sum = 0;
        for (const h of HABITS) sum += (state.habits[wk]?.[h] || [])[idx] || 0;
        v = sum;
      } else {
        v = (state.habits[wk]?.[habit] || [])[idx] || 0;
      }
      arr.push({ date: new Date(d), value: v });
    }
    return arr;
  }, [state.habits, habit, today.getTime()]);

  const maxVal = habit === "_combined" ? HABITS.length : 1;

  // Streak (per habit, or sum of all)
  let totalDone = 0;
  let activeDays = 0;
  for (const c of cells) {
    if (c.value > 0) { totalDone += c.value; activeDays++; }
  }

  // Month labels — sample month transitions at week starts
  // Compute label positions: for each Monday in the range, if its month differs from previous Monday's, show the month abbr at that column
  const monthLabels = [];
  let prevMonth = -1;
  let weekIdx = 0;
  for (let d = new Date(start); d <= today; d = addDays(d, 7)) {
    if (d.getMonth() !== prevMonth) {
      monthLabels.push({ idx: weekIdx, label: d.toLocaleDateString("en-US", { month: "short" }) });
      prevMonth = d.getMonth();
    }
    weekIdx++;
  }

  return html`
    <div class="modal-bg" onClick=${onClose}>
      <div class="modal" onClick=${e => e.stopPropagation()}>
        <div class="modal-header">
          <h2>Year heatmap</h2>
          <button class="btn btn-ghost btn-icon" onClick=${onClose}>✕</button>
        </div>

        <select class="select" value=${habit} onChange=${e => setHabit(e.target.value)} style="margin-bottom:12px">
          <option value="_combined">All habits combined</option>
          ${HABITS.map(h => html`<option key=${h} value=${h}>${HABIT_ICONS[h] || ""} ${h}</option>`)}
        </select>

        <div class="heatmap-wrap">
          <div class="heatmap">
            ${cells.map((c, i) => {
              const pct = maxVal > 0 ? Math.min(c.value / maxVal, 1) : 0;
              const bg = c.value === 0
                ? "var(--card-soft)"
                : `color-mix(in srgb, var(--done) ${20 + Math.round(pct * 70)}%, var(--card-soft))`;
              const label = `${dayKey(c.date)} — ${habit === "_combined" ? `${c.value}/${HABITS.length}` : (c.value === 1 ? "done" : c.value === 0.5 ? "half" : "—")}`;
              return html`<div class="heatmap-cell" key=${i} style=${`background:${bg}`} title=${label}></div>`;
            })}
          </div>
        </div>

        <p class="tiny" style="margin-top:10px">
          Past ${weeksBack} weeks · Mon top, Sun bottom · oldest on the left → most recent on the right.
        </p>

        <div class="row" style="gap:16px;margin-top:8px;justify-content:center">
          <span class="tiny">${activeDays} active days</span>
          ${habit === "_combined" && html`<span class="tiny">${totalDone.toFixed(1)} total completions</span>`}
        </div>
      </div>
    </div>
  `;
}

/* ======================================================================
   SEARCH MODAL
   ====================================================================== */

function SearchModal({ state, onClose }) {
  const [q, setQ] = useState("");
  const results = useMemo(() => searchAll(state, q), [state, q]);

  // Format the dateKey nicely depending on whether it's YYYY-MM-DD or YYYY-Www
  const fmtKey = (k) => {
    if (/^\d{4}-W\d{2}$/.test(k)) return k;
    if (/^\d{4}-\d{2}-\d{2}$/.test(k)) {
      const d = new Date(k + "T12:00:00");
      return fmtDate(d, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
    }
    return k;
  };

  return html`
    <div class="modal-bg" onClick=${onClose}>
      <div class="modal" onClick=${e => e.stopPropagation()} style="max-height:90vh">
        <div class="modal-header">
          <h2>Search journal</h2>
          <button class="btn btn-ghost btn-icon" onClick=${onClose}>✕</button>
        </div>
        <input
          class="input"
          placeholder="Search across all entries…"
          autofocus
          value=${q}
          onInput=${e => setQ(e.target.value)}
          style="margin-bottom:12px"
        />
        ${!q.trim() ? html`
          <p class="muted small">Type to search across daily check-ins, moon notes, gene key logs, intentions, and reviews.</p>
        ` : results.length === 0 ? html`
          <p class="empty">No matches.</p>
        ` : html`
          <p class="tiny" style="margin-bottom:4px">${results.length} result${results.length === 1 ? "" : "s"}</p>
          ${results.map((r, i) => html`
            <div class="search-result" key=${i}>
              <div class="search-meta">
                <span class="search-source">${r.source}</span>
                <span class="search-date">${fmtKey(r.dateKey)}</span>
              </div>
              <div class="search-text">${highlightHtml(r.text, q)}</div>
            </div>
          `)}
        `}
      </div>
    </div>
  `;
}
